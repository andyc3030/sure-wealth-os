name: Phase 13 Publish Runtime Image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/phase13-image-publish.yml"
      - "app/**"
      - "bin/**"
      - "config/**"
      - "db/**"
      - "lib/**"
      - "Gemfile"
      - "Gemfile.lock"
      - "Dockerfile"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: phase13-runtime-image
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish immutable Phase 13 image
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            BUILD_COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:phase13-${{ github.sha }}
            ghcr.io/${{ github.repository }}:phase13-latest

      - name: Record deployment image
        run: |
          {
            echo "## Phase 13 runtime image"
            echo
            echo "\`ghcr.io/${GITHUB_REPOSITORY}:phase13-${GITHUB_SHA}\`"
            echo
            echo "Moving tag: \`ghcr.io/${GITHUB_REPOSITORY}:phase13-latest\`"
          } >> "${GITHUB_STEP_SUMMARY}"
